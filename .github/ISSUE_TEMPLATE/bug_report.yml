name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include real phone numbers,
        message contents, or other personal data. For security problems, use the
        private reporting process in SECURITY.md instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About, for example 0.9.0.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Is Messages your default SMS app?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Persian
        - System default
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove phone numbers, message text, and contact names.
      render: shell
    validations:
      required: false
